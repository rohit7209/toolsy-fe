name: Deploy Frontend

on:
  push:
    branches:
      - main   # change if your prod branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      VITE_API_BASE_PATH: ${{ secrets.VITE_API_BASE_PATH }}

    steps:
      # ✅ Pull repo
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ✅ Faster installs
      - name: Install dependencies
        run: npm ci

      # ✅ Build Vite
      - name: Build project
        run: npm run build       

      # ✅ Generate release id
      - name: Generate release id
        run: echo "RELEASE=$(date +%s)" >> $GITHUB_ENV

      # Upload build to temp folder
      - name: Upload build
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/toolsy-${{ env.RELEASE }}"
          strip_components: 1

      # Create release using rsync hard links
      - name: Activate release (fast)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            set -e

            RELEASE=${{ env.RELEASE }}
            BASE=/var/www/toolsy
            PREV=$(ls -dt $BASE/releases/* 2>/dev/null | head -1 || true)

            mkdir -p $BASE/releases/$RELEASE

            if [ -n "$PREV" ]; then
              rsync -a --delete --link-dest=$PREV /tmp/toolsy-$RELEASE/ $BASE/releases/$RELEASE/
            else
              rsync -a /tmp/toolsy-$RELEASE/ $BASE/releases/$RELEASE/
            fi

            ln -sfn $BASE/releases/$RELEASE $BASE/current
            sudo systemctl reload nginx

            rm -rf /tmp/toolsy-$RELEASE
