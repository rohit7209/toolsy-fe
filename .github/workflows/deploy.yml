name: Deploy Frontend

on:
  push:
    branches:
      - main   # change if your prod branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ✅ Pull repo
      - name: Checkout code
        uses: actions/checkout@v4

      # ✅ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ✅ Faster installs
      - name: Install dependencies
        run: npm ci

      # ✅ Build React/Vite/etc
      - name: Build project
        run: npm run build


      ###################################
      # Copy build to LIGHTSAIL
      ###################################
      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "build/*"
          target: "/var/www/toolsy"


      ###################################
      # Reload nginx
      ###################################
      - name: Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            sudo systemctl reload nginx
